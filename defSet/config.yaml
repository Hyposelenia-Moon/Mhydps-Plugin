# Mhydps-Plugin 配置模板
# 锅巴保存时读取本文件，把 ${变量} 替换为表单值后写入 config/config.yaml
# priority：数字越小越先执行（默认 8000，低于 Atlas-Plugin 的 10000）
priority: ${mhydps_priority}

# 渲染缩放比例
renderScale: ${mhydps_renderScale}

# ---------- 数据源一 · mhydps.cn（DPS榜 / 危战榜） ----------
# 抓取 mhydps.cn 使用的代理，留空 = 直连
# 国内直连 www.mhydps.cn 会被重置（TLS 握手阶段 RST），需要本地代理
proxy: "${mhydps_proxy}"

# 单次请求超时（毫秒）
timeoutMs: ${mhydps_timeoutMs}

# ---------- 数据源一 · 缓存 ----------
# 榜单数据缓存有效期（分钟）
cacheTtlMinutes: ${mhydps_cacheTtlMinutes}

# 榜单每页条数
pageSize: ${mhydps_pageSize}

# 是否缓存并渲染角色立绘
avatarEnabled: ${mhydps_avatarEnabled}

# ---------- 数据源二 · akasha.cv（练度查询） ----------
# 默认 UID：命令里不写 UID 时用它（如「#DPS练度查询 胡桃」）
defaultUid: "${mhydps_defaultUid}"

# 面板立绘图库根目录（含 normal-character 那一层），留空 = 自动探测
# 自动探测顺序：plugins/ProfileImg-Plugin/resources/gallery/ProfileImg/miao-plugin-ProfileImg
#              → plugins/miao-plugin/resources/profile
profileImgDir: "${mhydps_profileImgDir}"

# miao-plugin 目录（练度面板完全复用它的模板与静态表），留空 = 自动探测 plugins/miao-plugin
miaoPluginDir: "${mhydps_miaoPluginDir}"

# miao-plugin 的 resources 目录（同上，用于反推插件位置），留空 = 自动探测
miaoResDir: "${mhydps_miaoResDir}"

# ---------- 数据源二 · akasha.cv 参数 ----------
# 启用练度查询（数据来自 akasha.cv，mhydps.cn 没有练度排名）
akashaEnabled: ${mhydps_akashaEnabled}

# akasha 的代理，留空 = 直连（akasha 不在墙内）
akashaProxy: "${mhydps_akashaProxy}"

# akasha 单次请求超时（毫秒，5000 ~ 180000；需要浏览器会话时会明显偏慢）
akashaTimeoutMs: ${mhydps_akashaTimeoutMs}

# akasha 练度数据缓存有效期（分钟）
akashaCacheTtlMinutes: ${mhydps_akashaCacheTtlMinutes}

# 一次练度查询最多列几个角色（1 ~ 30）
akashaMaxChars: ${mhydps_akashaMaxChars}
